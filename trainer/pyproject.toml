[project]
name = "trainer"
version = "0.1.0"
description = "Trainer worker for model training on GPU"
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "arq>=0.28.0",
    "datasets",
    "minio",
    "psycopg2-binary",
    "python-dotenv",
    "redis",
    "seqeval",
    "sqlalchemy",
    "torch>=2.7.0,<2.8.0",
    "transformers",
    "boto3",
    "mlflow==3.16.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
